global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting (optionnel - bonus Jour 5)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# rule_files:
#   - "alert_rules.yml"

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gaming-api'
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ['gaming-api:8080']

  - job_name: 'gaming-gateway'
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ['gaming-gateway:8080']
