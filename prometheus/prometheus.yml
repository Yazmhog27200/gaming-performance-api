global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting (optionnel - bonus Jour 5)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# rule_files:
#   - "alert_rules.yml"

scrape_configs:

  # Prometheus se scrappe lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Application Spring Boot via Micrometer
  - job_name: 'gaming-api'
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
    # Si app tourne dans Docker Compose, utiliser le nom du service :
    # - targets: ['app:8080']
